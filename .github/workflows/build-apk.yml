name: Build IF Jarvis Vosk APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Baixar modelo Vosk PT-BR
        shell: bash
        run: |
          rm -rf app/src/main/assets/model-pt /tmp/voskpt
          mkdir -p app/src/main/assets/model-pt /tmp/voskpt
          curl -L --fail --retry 3 \
            "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            -o /tmp/voskpt/model.zip
          unzip -q /tmp/voskpt/model.zip -d /tmp/voskpt
          cp -R /tmp/voskpt/vosk-model-small-pt-0.3/. app/src/main/assets/model-pt/
          python3 - <<'PY'
          import uuid, pathlib
          p = pathlib.Path("app/src/main/assets/model-pt/uuid")
          p.write_text(str(uuid.uuid4()), encoding="utf-8")
          PY

      - name: Compilar APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IF-Jarvis-Vosk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
